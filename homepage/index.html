<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteProxy</title>
<!--
  页面模板：结构 + 样式。
  所有内容（标题、站点列表、搜索引擎）来自 homepage/config.json，
  代理前缀由 Worker 在部署时注入，本文件无需修改即可工作。
-->
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 860px; }
  h1 { font-size: 28px; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 28px; font-size: 14px; }
  form { display: flex; gap: 10px; margin-bottom: 32px; }
  input {
    flex: 1;
    padding: 12px 16px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 22px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  a.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .host { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  footer { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <h1 id="page-title"></h1>
  <p class="sub" id="page-subtitle"></p>

  <form id="search-form">
    <input id="q" type="text" placeholder="输入关键词，回车搜索…" autocomplete="off">
    <button type="submit" id="search-btn"></button>
  </form>

  <div id="sites" class="grid"></div>

  <footer>内容配置于 homepage/config.json · 提交代码后自动部署</footer>
</main>

<script>
// 页面配置由 Worker 注入（来自 homepage/config.json + wrangler 变量）
const PAGE_CONFIG = __PAGE_CONFIG__;

function toProxyUrl(u) {
  return PAGE_CONFIG.proxyPrefix.replace(/\/?$/, '/') + u;
}

// 标题与副标题
document.title = PAGE_CONFIG.title;
const titleEl = document.getElementById('page-title');
const main = /SiteProxy/i.exec(PAGE_CONFIG.title);
titleEl.textContent = PAGE_CONFIG.title;
if (main) {
  titleEl.innerHTML = '';
  titleEl.append(PAGE_CONFIG.title.slice(0, main.index));
  const span = document.createElement('span');
  span.textContent = main[0];
  titleEl.append(span, PAGE_CONFIG.title.slice(main.index + main[0].length));
}
document.getElementById('page-subtitle').textContent = PAGE_CONFIG.subtitle || '';

// 搜索引擎
const se = PAGE_CONFIG.searchEngine || {};
document.getElementById('search-btn').textContent = se.name ? (se.name + ' 搜索') : '搜索';
document.getElementById('q').placeholder = '输入关键词，回车用 ' + (se.name || '搜索引擎') + ' 搜索…';

// 站点导航
const grid = document.getElementById('sites');
for (const s of (PAGE_CONFIG.sites || [])) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = toProxyUrl(s.url);
  const host = s.url.replace(/^https?\/+/, '').replace(/\/+$/, '') || s.url;
  a.innerHTML = '<div class="name"></div><div class="host"></div>';
  a.querySelector('.name').textContent = s.name;
  a.querySelector('.host').textContent = host;
  grid.appendChild(a);
}

// 搜索跳转
document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (q && se.url) location.href = toProxyUrl(se.url) + encodeURIComponent(q);
});
</script>
</body>
</html>
